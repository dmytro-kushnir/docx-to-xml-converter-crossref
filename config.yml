
app:
  inject_pdf_pages: false
  # Folder of submitted DOCX files for the issue being processed. Changes every
  # issue; override for a one-off run with `python main.py /path/to/folder`.
  # Leave empty to read the repository's `articles/` folder.
  input_folder: ""
  output_folder: "output"

validation:
  # Refuse to write XML while any article still has a blocking defect.
  # Page ranges are only ever warnings: they stay provisional until the
  # typeset PDF exists.
  fail_on_error: true

crossref:
  schema_version: "5.4.0"
  # Deliberately empty: falling back to a default institution silently credited
  # other universities' authors to LPNU. An unmapped affiliation is now reported
  # so its real ROR can be added to `institutions` below.
  default_institution: null

# ROR registry URLs — used for <institution_id type="ror"> in schema 5.4.0+
institutions:
  lpnu:
    name: "Lviv Polytechnic National University"
    ror: "https://ror.org/0542q3127"
    aliases:
      - "Lviv Polytechnic"
      - "National University Lviv Polytechnic"
      # Typographic apostrophe and the Ukrainian form of the same name, both of
      # which appear verbatim in submitted articles.
      - "L’viv Polytechnic National University"
      - "Національний університет «Львівська політехніка»"
      - "Львівська політехніка"
