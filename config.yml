
app:
  inject_pdf_pages: false
  # Folder of submitted DOCX files for the issue being processed. Changes every
  # issue; override for a one-off run with `python main.py /path/to/folder`.
  # Leave empty to read the repository's `articles/` folder.
  input_folder: ""
  output_folder: "output"

submission_dates:
  # Editorial dates written into every article's author block, in both
  # languages, by `python -m docx_editing.add_submission_dates`.
  # ХХ.ХХ.ХХХХ is the placeholder the template ships with: leaving a field as
  # the placeholder means "not decided yet", and the line stays blank-looking.
  received: "01.09.2026"
  accepted: "14.10.2026"
  published: "01.12.2026"
  # Received/accepted differ per article, so a date an editor already filled in
  # wins over the values above. Set this to replace those too.
  overwrite_existing: false

validation:
  # Refuse to write XML while any article still has a blocking defect.
  # Page ranges are only ever warnings: they stay provisional until the
  # typeset PDF exists.
  fail_on_error: true

crossref:
  schema_version: "5.4.0"
  # Deliberately empty: falling back to a default institution silently credited
  # other universities' authors to LPNU. An unmapped affiliation is now reported
  # so its real ROR can be added to `institutions` below.
  default_institution: null

# Institution -> ROR registry lives in institutions.yml (it grows every issue).

publication:
  year: "2026"
  month: "12"
  volume: "8"
  issue: "2"

journal:
  doi: "10.23939/csn"
  base_url: "https://science.lpnu.ua/csn"
  issn:
    print: "27072371"
    electronic: "27072371"
  # As registered with the ISSN centre ("networks" — the deposited title had lost the "s").
  full_title: "Computer systems and network"
  # Ukrainian title as in the registration certificate (used in the DOI letter).
  title_uk: "Комп’ютерні системи та мережі"
  abbrev_title: "CSN"

depositor:
  name: "name:name"
  email: "email"

registrant: "registrant"

license:
  url: "https://creativecommons.org/licenses/by/4.0/"
  applies_to: "vor"  # version of record (Crossref AccessIndicators)
