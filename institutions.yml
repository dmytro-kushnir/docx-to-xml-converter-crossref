# Institution -> ROR registry, used for <institution_id type="ror"> in Crossref
# schema 5.4.0+ and by the validator's unmapped-affiliation check.
#
# This is an append-only reference table, not per-issue settings: it grows as
# new universities appear in submissions and is never "set" for an issue, which
# is why it lives here rather than in config.yml.
#
# Each entry: a stable id, the canonical English name deposited to Crossref, the
# ROR URL, and any aliases seen verbatim in submitted articles (Ukrainian forms,
# former names, typographic variants). Never invent a ROR — look it up at
# https://ror.org/search and leave `ror: ""` until a human confirms it.

# ROR registry URLs — used for <institution_id type="ror"> in schema 5.4.0+
institutions:
  lpnu:
    name: "Lviv Polytechnic National University"
    ror: "https://ror.org/0542q3127"
    aliases:
      - "Lviv Polytechnic"
      - "National University Lviv Polytechnic"
      # Typographic apostrophe and the Ukrainian form of the same name, both of
      # which appear verbatim in submitted articles.
      - "L’viv Polytechnic National University"
      - "Національний університет «Львівська політехніка»"
      - "Львівська політехніка"
